services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: samantha-postgres
    environment:
      POSTGRES_USER: samantha
      POSTGRES_PASSWORD: samantha_dev
      POSTGRES_DB: samantha
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - samantha-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samantha -d samantha"]
      interval: 5s
      retries: 10

volumes:
  samantha-pgdata:
